<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - LaporAja</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-light">
    <div id="navbarMount"></div>

    <main class="container py-5">
      <section class="login-wrap mx-auto">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4 p-md-5">
            <h2 class="h4 mb-2">Selamat datang</h2>
            <p class="text-secondary mb-4">
              Buat akun dulu atau masuk dengan akun yang sudah ada.
            </p>

            <div id="authAlert" class="alert d-none py-2 mb-3" role="alert"></div>

            <ul class="nav nav-pills nav-fill mb-3" id="authTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button
                  class="nav-link active"
                  id="login-tab"
                  data-bs-toggle="tab"
                  data-bs-target="#login-pane"
                  type="button"
                  role="tab"
                >
                  Masuk
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button
                  class="nav-link"
                  id="register-tab"
                  data-bs-toggle="tab"
                  data-bs-target="#register-pane"
                  type="button"
                  role="tab"
                >
                  Daftar
                </button>
              </li>
            </ul>

            <div class="tab-content" id="authTabContent">
              <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
                <form id="loginForm" novalidate>
                  <div class="mb-3">
                    <label for="loginEmail" class="form-label">Email</label>
                    <input id="loginEmail" type="email" class="form-control" required />
                  </div>
                  <div class="mb-3">
                    <label for="loginPassword" class="form-label">Password</label>
                    <input id="loginPassword" type="password" class="form-control" minlength="6" required />
                  </div>
                  <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Masuk</button>
                  </div>
                </form>
              </div>

              <div class="tab-pane fade" id="register-pane" role="tabpanel">
                <form id="registerForm" novalidate>
                  <div class="mb-3">
                    <label for="registerName" class="form-label">Nama</label>
                    <input id="registerName" type="text" class="form-control" minlength="2" required />
                  </div>
                  <div class="mb-3">
                    <label for="registerEmail" class="form-label">Email</label>
                    <input id="registerEmail" type="email" class="form-control" required />
                  </div>
                  <div class="mb-3">
                    <label for="registerPassword" class="form-label">Password</label>
                    <input id="registerPassword" type="password" class="form-control" minlength="6" required />
                  </div>
                  <div class="d-grid">
                    <button type="submit" class="btn btn-outline-primary">Daftar & Masuk</button>
                  </div>
                </form>
              </div>
            </div>

            <hr class="my-4" />

            <div class="d-grid gap-2">
              <button type="button" class="btn btn-outline-dark" disabled>
                Masuk dengan Google (segera hadir)
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navbar-component.js"></script>
    <script src="js/nav-scroll.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
