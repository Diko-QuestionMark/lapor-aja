[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 301

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 301

[[redirects]]
  from = "/reports"
  to = "/.netlify/functions/reports"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/admin/reports"
  to = "/.netlify/functions/admin-reports"
  status = 200

[[redirects]]
  from = "/auth/register"
  to = "/.netlify/functions/auth?action=register"
  status = 200

[[redirects]]
  from = "/auth/login"
  to = "/.netlify/functions/auth?action=login"
  status = 200

[[redirects]]
  from = "/me"
  to = "/.netlify/functions/me"
  status = 200

[[redirects]]
  from = "/users"
  to = "/.netlify/functions/users"
  status = 200

[[redirects]]
  from = "/report-comments"
  to = "/.netlify/functions/report-comments"
  status = 200

[[redirects]]
  from = "/report-feedback"
  to = "/.netlify/functions/report-feedback"
  status = 200

[[redirects]]
  from = "/report-status-history"
  to = "/.netlify/functions/report-status-history"
  status = 200

[[redirects]]
  from = "/notifications"
  to = "/.netlify/functions/notifications"
  status = 200
