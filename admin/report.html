<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Penanganan Admin - LaporAja</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="/img/icon.png" as="image" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="bg-light">
    <div id="navbar-mount"></div>

    <main class="container py-4 content-narrow">
      <section class="card shadow-sm mb-3">
        <div class="card-body">
          <h2 class="h5 mb-3">Detail Laporan</h2>
          <div id="adminReportDetail">
            <article class="admin-skeleton-card" aria-hidden="true">
              <div class="admin-skeleton-line admin-skeleton-line-title"></div>
              <div class="admin-skeleton-line admin-skeleton-line-meta"></div>
              <div class="admin-skeleton-thumb admin-skeleton-thumb-wide mb-2"></div>
              <div class="admin-skeleton-line admin-skeleton-line-desc"></div>
              <div class="admin-skeleton-line admin-skeleton-line-desc-short"></div>
              <div class="admin-skeleton-panel"></div>
            </article>
          </div>
        </div>
      </section>

      <section class="card shadow-sm">
        <div class="card-body">
          <h3 id="adminHandleTitle" class="h6 mb-3">Tindak Lanjut Instansi</h3>
          <div id="handleLoading" class="mb-2">
            <div class="admin-skeleton-line admin-skeleton-line-status"></div>
            <div class="admin-skeleton-line admin-skeleton-line-desc"></div>
            <div class="admin-skeleton-line admin-skeleton-line-desc-short"></div>
            <div class="admin-skeleton-pill mt-2"></div>
          </div>
          <form id="adminHandleForm" class="row g-3 d-none">
            <div class="col-md-4">
              <label for="statusInput" class="form-label">Status</label>
              <select id="statusInput" class="form-select">
                <option value="Menunggu">Menunggu</option>
                <option value="Diproses">Diproses</option>
                <option value="Selesai">Selesai</option>
              </select>
            </div>
            <div class="col-12">
              <label for="evidenceFileInput" class="form-label">Upload Bukti Foto (opsional)</label>
              <input id="evidenceFileInput" type="file" accept="image/*" class="form-control" />
            </div>
            <div class="col-12">
              <label for="noteInput" class="form-label">Catatan Respons Instansi</label>
              <textarea id="noteInput" rows="4" class="form-control" placeholder="Contoh: tim perbaikan turun hari ini pukul 10.00 WIB."></textarea>
            </div>
            <div class="col-12">
              <button id="saveHandleBtn" type="submit" class="btn btn-dark">Simpan Respons</button>
            </div>
          </form>
          <div id="handleNotice" class="small mt-2"></div>
        </div>
      </section>

      <section class="card shadow-sm mt-3">
        <div class="card-body">
          <h3 class="h6 mb-2">Feedback Warga untuk Respons</h3>
          <p class="small text-secondary mb-3">
            Gunakan ringkasan ini untuk memperbaiki jawaban instansi.
          </p>
          <div id="adminResponseFeedback" class="text-secondary small">
            <div class="admin-skeleton-metrics" aria-hidden="true">
              <div class="admin-skeleton-pill"></div>
              <div class="admin-skeleton-pill"></div>
              <div class="admin-skeleton-pill"></div>
            </div>
            <div class="admin-skeleton-line admin-skeleton-line-meta mt-2"></div>
          </div>
        </div>
      </section>

      <section class="card shadow-sm mt-3">
        <div class="card-body">
          <h3 class="h6 mb-3">Komentar</h3>
          <div id="adminCommentList" class="text-secondary">
            <article class="admin-skeleton-feedback-card" aria-hidden="true">
              <div class="admin-skeleton-line admin-skeleton-line-title"></div>
              <div class="admin-skeleton-line admin-skeleton-line-meta"></div>
            </article>
            <article class="admin-skeleton-feedback-card" aria-hidden="true">
              <div class="admin-skeleton-line admin-skeleton-line-title"></div>
              <div class="admin-skeleton-line admin-skeleton-line-meta"></div>
            </article>
          </div>
        </div>
      </section>
    </main>

    <script src="/js/navbar-component.js"></script>
    <script src="/js/nav-scroll.js"></script>
    <script src="/js/admin-report.js"></script>
  </body>
</html>
