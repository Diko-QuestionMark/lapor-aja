<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback Respons Warga - LaporAja</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="/img/icon.png" as="image" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="bg-light">
    <div id="navbar-mount"></div>

    <main class="container py-4 content-narrow">
      <section class="d-flex justify-content-between align-items-center mb-3 gap-2 flex-wrap">
        <h2 class="h5 mb-0">Feedback Respons Warga</h2>
        <div class="d-flex align-items-center gap-2">
          <a href="/admin/index.html" class="btn btn-sm btn-outline-dark">Dashboard</a>
          <a href="/rekap.html" class="btn btn-sm btn-dark">Rekap</a>
        </div>
      </section>

      <section class="card shadow-sm mb-3">
        <div class="card-body">
          <div class="row g-2">
            <div class="col-12 col-md-5">
              <label for="feedbackSearchInput" class="form-label small text-secondary mb-1">Cari</label>
              <input
                id="feedbackSearchInput"
                type="search"
                class="form-control form-control-sm"
                placeholder="Cari judul laporan / instansi / id..."
              />
            </div>
            <div class="col-6 col-md-2">
              <label for="feedbackRevisionFilter" class="form-label small text-secondary mb-1">Revisi</label>
              <select id="feedbackRevisionFilter" class="form-select form-select-sm">
                <option value="all">Semua</option>
                <option value="need">Perlu Revisi</option>
              </select>
            </div>
            <div class="col-6 col-md-2">
              <label for="feedbackStatusFilter" class="form-label small text-secondary mb-1">Status</label>
              <select id="feedbackStatusFilter" class="form-select form-select-sm">
                <option value="all">Semua</option>
                <option value="waiting">Menunggu</option>
                <option value="in_progress">Diproses</option>
                <option value="done">Selesai</option>
              </select>
            </div>
            <div class="col-12 col-md-3">
              <label for="feedbackSortFilter" class="form-label small text-secondary mb-1">Urutkan</label>
              <select id="feedbackSortFilter" class="form-select form-select-sm">
                <option value="priority">Prioritas Revisi</option>
                <option value="unhelpful">Paling Banyak Tidak Membantu</option>
                <option value="approval_low">Approval Terendah</option>
                <option value="newest">Terbaru</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <section class="card shadow-sm mb-3">
        <div class="card-body">
          <div id="feedbackMetrics" class="text-secondary small">
            <div class="admin-skeleton-metrics" aria-hidden="true">
              <div class="admin-skeleton-pill"></div>
              <div class="admin-skeleton-pill"></div>
              <div class="admin-skeleton-pill"></div>
              <div class="admin-skeleton-pill"></div>
            </div>
            <div class="admin-skeleton-line admin-skeleton-line-meta mt-2"></div>
          </div>
        </div>
      </section>

      <section class="card shadow-sm">
        <div class="card-body">
          <h3 class="h6 card-title mb-3">Daftar Prioritas Feedback</h3>
          <div id="feedbackList" class="text-secondary small">
            <article class="admin-skeleton-feedback-card" aria-hidden="true">
              <div class="admin-skeleton-head">
                <div class="admin-skeleton-line admin-skeleton-line-title"></div>
                <div class="admin-skeleton-line admin-skeleton-line-status"></div>
              </div>
              <div class="admin-skeleton-line admin-skeleton-feedback-meta"></div>
              <div class="admin-skeleton-line admin-skeleton-line-meta"></div>
            </article>
            <article class="admin-skeleton-feedback-card" aria-hidden="true">
              <div class="admin-skeleton-head">
                <div class="admin-skeleton-line admin-skeleton-line-title"></div>
                <div class="admin-skeleton-line admin-skeleton-line-status"></div>
              </div>
              <div class="admin-skeleton-line admin-skeleton-feedback-meta"></div>
              <div class="admin-skeleton-line admin-skeleton-line-meta"></div>
            </article>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/navbar-component.js"></script>
    <script src="/js/nav-scroll.js"></script>
    <script src="/js/admin-feedback.js"></script>
  </body>
</html>
