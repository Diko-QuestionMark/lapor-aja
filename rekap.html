<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rekap Laporan - LaporAja</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-light">
    <div id="navbarMount"></div>

    <main class="container py-4 pengecilan">
      <section class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h2 class="h5 mb-1">Rekap Laporan</h2>
          <p id="rekapSubtitle" class="small text-secondary mb-0">Semua Waktu</p>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button id="printRekapBtn" type="button" class="btn btn-sm btn-dark">
            Cetak Rekap
          </button>
        </div>
      </section>

      <section class="card shadow-sm">
        <div class="card-body">
          <div class="d-flex align-items-center gap-2 mb-3">
            <h3 class="h6 mb-0">Ringkasan</h3>
            <span id="rekapTotalBadge" class="badge text-bg-light border">0</span>
          </div>
          <div id="rekapSummary" class="row g-3"></div>
        </div>
      </section>

      <section class="card shadow-sm mt-3">
        <div class="card-body">
          <h3 class="h6 mb-3">Daftar Ringkas</h3>
          <div id="rekapList" class="text-secondary">Memuat data...</div>
        </div>
      </section>
    </main>

    <div class="modal fade" id="rekapFilterModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-6">Filter Rekap</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="rekapFilterForm" class="row g-3">
              <div class="col-12">
                <label for="rekapTimeFilter" class="form-label">Rentang Waktu</label>
                <select id="rekapTimeFilter" class="form-select">
                  <option value="all">Semua Waktu</option>
                  <option value="today">Hari Ini</option>
                  <option value="week">Minggu Ini</option>
                  <option value="month">Bulan Ini</option>
                </select>
              </div>
              <div class="col-12">
                <label for="rekapStatusFilter" class="form-label">Status</label>
                <select id="rekapStatusFilter" class="form-select">
                  <option value="all">Semua Status</option>
                  <option value="Menunggu">Menunggu</option>
                  <option value="Diproses">Diproses</option>
                  <option value="Selesai">Selesai</option>
                </select>
              </div>
              <div class="col-12">
                <label for="rekapAgencyFilter" class="form-label">Instansi</label>
                <select id="rekapAgencyFilter" class="form-select">
                  <option value="all">Semua Instansi</option>
                  <option value="Umum">Umum</option>
                  <option value="Dinas PU">Dinas PU</option>
                  <option value="Dinas Perhubungan">Dinas Perhubungan</option>
                  <option value="Dinas Kebersihan">Dinas Kebersihan</option>
                  <option value="Dinas Lingkungan Hidup">Dinas Lingkungan Hidup</option>
                  <option value="PDAM">PDAM</option>
                  <option value="PLN">PLN</option>
                  <option value="Makan Bergizi Gratis (MBG)">Makan Bergizi Gratis (MBG)</option>
                  <option value="Satpol PP">Satpol PP</option>
                </select>
              </div>
              <div class="col-12">
                <label for="rekapLimitInput" class="form-label">Maksimal Laporan</label>
                <input
                  id="rekapLimitInput"
                  type="number"
                  min="1"
                  max="500"
                  step="1"
                  class="form-control"
                  value="50"
                />
                <div class="form-text">Maksimal 500 laporan.</div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button id="rekapApplyBtn" type="button" class="btn btn-dark">
              Terapkan & Cetak
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navbar-component.js"></script>
    <script src="js/nav-scroll.js"></script>
    <script src="js/rekap.js"></script>
  </body>
</html>
