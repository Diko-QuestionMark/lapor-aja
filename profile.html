<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil - LaporAja</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="preload" href="/img/icon.png" as="image" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="bg-light">
    <div id="navbar-mount"></div>

    <main class="container py-4 content-narrow">
      <section class="card shadow-sm mb-3">
        <div class="card-body">
          <div id="profileAlert" class="alert d-none py-2 mb-3" role="alert"></div>
          <div class="d-flex gap-3 align-items-start profile-head-row">
            <img id="profileAvatar" class="profile-avatar" alt="Foto profil" />
            <div class="flex-grow-1 profile-head-main">
              <div id="profileInfo" class="text-secondary mb-3">Memuat profil...</div>
              <div class="d-flex flex-wrap gap-2">
                <button id="editProfileBtn" type="button" class="btn btn-primary btn-sm d-none">Edit Profil</button>
                <button id="logoutBtn" type="button" class="btn btn-outline-danger btn-sm">Keluar Akun</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="row g-3 mb-3" id="profileStats"></section>

      <section class="card shadow-sm">
        <div class="card-body">
          <h3 id="profileReportsTitle" class="h6 mb-1">Laporan Saya</h3>
          <p id="profileReportsSubtitle" class="small text-secondary mb-3"></p>
          <div id="profileReports" class="text-secondary">Memuat laporan...</div>
        </div>
      </section>
    </main>

    <div class="modal fade" id="logoutConfirmModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5">Konfirmasi Logout</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            Yakin ingin keluar dari akun ini?
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
            <button id="confirmLogoutBtn" type="button" class="btn btn-danger">Ya, Keluar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="editProfileModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-6">Edit Profil</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form id="profileForm">
            <div class="modal-body">
              <div class="d-flex justify-content-center mb-3">
                <img id="profilePhotoPreview" class="profile-avatar preview-avatar" alt="Preview foto profil" />
              </div>
              <div class="mb-3">
                <label for="profileName" class="form-label">Nama Tampilan</label>
                <input id="profileName" type="text" class="form-control" minlength="2" required />
              </div>
              <div class="mb-3">
                <label for="profilePhoto" class="form-label">Foto Profil</label>
                <input id="profilePhoto" type="file" accept="image/*" class="form-control" />
                <div class="form-text">Opsional, maksimal 2MB.</div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
              <button id="saveProfileBtn" type="submit" class="btn btn-primary">Simpan</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="position-fixed bottom-0 end-0 p-3 toast-wrap">
      <div id="profileToast" class="toast align-items-center border-0 text-bg-success" role="status" aria-live="polite" aria-atomic="true">
        <div class="d-flex">
          <div id="profileToastBody" class="toast-body">Sukses</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navbar-component.js"></script>
    <script src="js/nav-scroll.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
