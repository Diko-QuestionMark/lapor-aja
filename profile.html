<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil - LaporAja</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-light">
    <div id="navbarMount"></div>

    <main class="container py-4 pengecilan">
      <section class="card shadow-sm mb-3">
        <div class="card-body">
          <div id="profileAlert" class="alert d-none py-2 mb-3" role="alert"></div>
          <div class="d-flex flex-column flex-md-row gap-3 align-items-start">
            <img id="profileAvatar" class="profile-avatar" alt="Foto profil" />
            <div class="flex-grow-1">
              <h2 class="h5 mb-3">Informasi Akun</h2>
              <div id="profileInfo" class="text-secondary mb-3">Memuat profil...</div>
              <form id="profileForm" class="row g-2">
                <div class="col-12 col-md-6">
                  <label for="profileName" class="form-label">Nama Tampilan</label>
                  <input id="profileName" type="text" class="form-control" minlength="2" required />
                </div>
                <div class="col-12 col-md-6">
                  <label for="profilePhoto" class="form-label">Foto Profil</label>
                  <input id="profilePhoto" type="file" accept="image/*" class="form-control" />
                  <div class="form-text">Opsional, maksimal 2MB.</div>
                </div>
                <div class="col-12">
                  <div class="d-flex flex-wrap gap-2">
                    <button id="saveProfileBtn" type="submit" class="btn btn-primary btn-sm">Simpan Perubahan Profil</button>
                    <a id="adminDashboardBtn" href="/admin.html" class="btn btn-dark btn-sm d-none">Dashboard Admin</a>
                    <button id="logoutBtn" type="button" class="btn btn-outline-secondary btn-sm">Keluar Akun</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>

      <section class="row g-3 mb-3" id="profileStats"></section>

      <section class="card shadow-sm mb-3">
        <div class="card-body">
          <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
            <h3 class="h6 mb-0">Notifikasi Respons Instansi</h3>
            <span id="notificationUnreadBadge" class="badge text-bg-danger d-none">0 baru</span>
          </div>
          <div id="profileNotifications" class="text-secondary">Memuat notifikasi...</div>
        </div>
      </section>

      <section class="card shadow-sm">
        <div class="card-body">
          <h3 class="h6 mb-3">Laporan Saya</h3>
          <div id="profileReports" class="text-secondary">Memuat laporan...</div>
        </div>
      </section>
    </main>

    <div class="modal fade" id="logoutConfirmModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5">Konfirmasi Logout</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            Yakin ingin keluar dari akun ini?
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
            <button id="confirmLogoutBtn" type="button" class="btn btn-primary">Ya, Keluar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navbar-component.js"></script>
    <script src="js/nav-scroll.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
