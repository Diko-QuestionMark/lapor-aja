<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaporAja</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css">
  </head>

  <body class="bg-light">
    <div id="navbarMount"></div>

    <main class="container py-4 pengecilan">
      <section class="d-flex justify-content-between align-items-center mb-3">
        <h2 id="reportSectionTitle" class="h5 mb-0">Laporan Warga</h2>
        <button
          id="createReportBtn"
          class="btn btn-primary"
          type="button"
          data-bs-toggle="modal"
          data-bs-target="#reportModal"
        >
          Buat Laporan
        </button>
      </section>

      <section class="card shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
            <div class="d-flex align-items-center gap-2">
              <h3 class="h6 card-title mb-0">Daftar Laporan</h3>
              <span id="reportCount" class="badge text-bg-light border">0</span>
            </div>
            <div class="d-flex align-items-center gap-2 flex-nowrap search-filter-wrap">
              <input
                id="searchInput"
                type="search"
                class="form-control form-control-sm search-input search-inline-input"
                placeholder="Cari laporan..."
                autocomplete="off"
              />
              <button
                class="btn btn-sm btn-outline-primary d-inline-flex align-items-center gap-2"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#filterPanel"
                aria-expanded="false"
                aria-controls="filterPanel"
              >
                <i class="bi bi-funnel"></i>
                <span>Filter</span>
              </button>
            </div>
          </div>
          <div class="collapse mb-3" id="filterPanel">
            <div class="border rounded p-2">
              <div class="row g-2">
                <div class="col-12 col-md-6">
                  <label for="sortFilter" class="form-label form-label-sm mb-1 small text-secondary">Urutkan</label>
                  <select id="sortFilter" class="form-select form-select-sm">
                    <option value="newest">Terbaru</option>
                    <option value="oldest">Terlama</option>
                    <option value="upvotes">Dukungan Terbanyak</option>
                    <option value="status_waiting">Menunggu Dulu</option>
                    <option value="status_done">Selesai Dulu</option>
                  </select>
                </div>
                <div class="col-12 col-md-6">
                  <label for="timeFilter" class="form-label form-label-sm mb-1 small text-secondary">Rentang Waktu</label>
                  <select id="timeFilter" class="form-select form-select-sm">
                    <option value="all">Semua Waktu</option>
                    <option value="today">Hari Ini</option>
                    <option value="week">Minggu Ini</option>
                    <option value="month">Bulan Ini</option>
                  </select>
                </div>
                <div class="col-12 col-md-6">
                  <label for="agencyFilterUser" class="form-label form-label-sm mb-1 small text-secondary">Instansi</label>
                  <select id="agencyFilterUser" class="form-select form-select-sm flex-grow-1">
                    <option value="all">Semua Instansi</option>
                    <option value="Umum">Umum</option>
                    <option value="Dinas PU">Dinas PU</option>
                    <option value="Dinas Perhubungan">Dinas Perhubungan</option>
                    <option value="Dinas Kebersihan">Dinas Kebersihan</option>
                    <option value="Dinas Lingkungan Hidup">Dinas Lingkungan Hidup</option>
                    <option value="PDAM">PDAM</option>
                    <option value="PLN">PLN</option>
                    <option value="Makan Bergizi Gratis (MBG)">Makan Bergizi Gratis (MBG)</option>
                    <option value="Satpol PP">Satpol PP</option>
                  </select>
                </div>
                <div class="col-12 col-md-6 d-flex align-items-end justify-content-md-end">
                  <button
                    id="resetFilterBtn"
                    type="button"
                    class="btn btn-sm btn-outline-secondary"
                  >
                    Reset
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div id="reportList"></div>
        </div>
      </section>
    </main>

    <div class="modal fade" id="reportModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-xl modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5">Kirim Laporan</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-12 col-lg-7">
                <div class="mb-3">
                  <label for="photo" class="form-label">Foto Masalah</label>
                  <input
                    class="form-control"
                    type="file"
                    id="photo"
                    accept="image/*"
                    capture="environment"
                  />
                  <div class="form-text">Bisa pilih hingga 5 foto. Kamu bisa tambah foto satu per satu.</div>
                  <div id="photoError" class="small text-danger mt-1 d-none"></div>
                </div>

                <div id="photoPreviewWrap" class="preview-wrap d-none">
                  <div id="photoPreviewGrid" class="photo-preview-grid"></div>
                  <div id="photoPreviewCount" class="small text-secondary mt-2"></div>
                </div>
              </div>

              <div class="col-12 col-lg-5">
                <div class="mb-3">
                  <label for="title" class="form-label">Judul</label>
                  <input
                    id="title"
                    type="text"
                    class="form-control"
                    maxlength="100"
                    placeholder="contoh: Lampu Jalan Mati di Jl. Merdeka"
                  />
                  <div id="titleError" class="small text-danger mt-1 d-none"></div>
                </div>

                <div class="mb-3">
                  <label for="agency" class="form-label">Tujuan Instansi</label>
                  <select id="agency" class="form-select">
                    <option value="Umum">Umum</option>
                    <option value="Dinas PU">Dinas PU</option>
                    <option value="Dinas Perhubungan">Dinas Perhubungan</option>
                    <option value="Dinas Kebersihan">Dinas Kebersihan</option>
                    <option value="Dinas Lingkungan Hidup">Dinas Lingkungan Hidup</option>
                    <option value="PDAM">PDAM</option>
                    <option value="PLN">PLN</option>
                    <option value="Makan Bergizi Gratis (MBG)">Makan Bergizi Gratis (MBG)</option>
                    <option value="Satpol PP">Satpol PP</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="desc" class="form-label">Deskripsi (opsional)</label>
                  <textarea
                    id="desc"
                    class="form-control"
                    rows="6"
                    placeholder="contoh: lampu jalan mati"
                  ></textarea>
                </div>

                <div class="form-check mb-2">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="useLocation"
                    onchange="toggleLocation(this)"
                  />
                  <label class="form-check-label" for="useLocation">
                    Gunakan Lokasi Saya
                  </label>
                </div>

                <p id="locText" class="small text-secondary mb-0"></p>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
            <button id="submitBtn" type="button" class="btn btn-primary" onclick="submitReport()">
              Kirim Laporan
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="position-fixed bottom-0 end-0 p-3 toast-wrap">
      <div id="appToast" class="toast align-items-center border-0 text-bg-dark" role="status" aria-live="polite" aria-atomic="true">
        <div class="d-flex">
          <div id="appToastBody" class="toast-body">Sukses</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>

    <div class="modal fade" id="imageInspectModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h2 id="imageInspectTitle" class="modal-title fs-6">Detail Foto Laporan</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center">
            <img id="imageInspectPreview" class="img-fluid rounded border inspect-modal-image" alt="Detail foto laporan" />
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="navbar-component.js"></script>
    <script src="nav-scroll.js"></script>
    <script src="script.js"></script>
  </body>
</html>
