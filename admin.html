<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaporAja Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <div id="navbarMount"></div>

    <main class="container py-4 pengecilan">
      <section class="card shadow-sm mb-3">
        <div class="card-body">
          <div class="row g-2 align-items-end">
            <div class="col-md-6">
              <label for="adminKey" class="form-label">Admin Key</label>
              <input id="adminKey" class="form-control" type="password" placeholder="Masukkan ADMIN_KEY" />
            </div>
            <div class="col-md-auto">
              <button id="saveKeyBtn" class="btn btn-dark">Simpan & Muat Data</button>
            </div>
          </div>
          <p class="small text-secondary mt-2 mb-0">
            Gunakan Environment Variable <code>ADMIN_KEY</code> di Netlify agar endpoint admin terlindungi.
          </p>
        </div>
      </section>

      <section class="card shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap mb-2">
            <h2 class="h5 mb-0">Daftar Laporan</h2>
            <select id="agencyFilter" class="form-select form-select-sm" style="max-width: 260px;">
              <option value="all">Semua Instansi</option>
              <option value="Umum">Umum</option>
              <option value="Dinas PU">Dinas PU</option>
              <option value="Dinas Perhubungan">Dinas Perhubungan</option>
              <option value="Dinas Kebersihan">Dinas Kebersihan</option>
              <option value="Dinas Lingkungan Hidup">Dinas Lingkungan Hidup</option>
              <option value="PDAM">PDAM</option>
              <option value="PLN">PLN</option>
              <option value="Satpol PP">Satpol PP</option>
            </select>
          </div>
          <div id="adminList" class="mt-3"></div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="navbar-component.js"></script>
    <script src="nav-scroll.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
